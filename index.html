["The Four-Day Working Week","The idea of a four-day working week, once considered unrealistic, has attracted serious attention in recent years. In several trials across Europe, employees kept their full salaries but worked fewer days, and the results were surprising. Companies reported that productivity remained stable, while absences due to illness fell significantly. Workers said they felt less stressed and more motivated, since the extra day off allowed them to rest, spend time with their families or pursue personal interests. Critics, however, argue that the model is unsuitable for sectors such as healthcare or manufacturing, where continuous coverage is essential. Others fear that employees might simply work longer hours on the remaining days, which would defeat the purpose. Supporters respond that the benefits depend on careful planning and that flexibility, not a rigid rule, should be the goal.",["What happened to productivity in the trials?|It fell sharply|It stayed stable|It doubled|1","What fell significantly?|Salaries|Absences due to illness|Working days|1","Why do critics consider the model unsuitable for some sectors?|Continuous coverage is needed|Workers dislike days off|Costs are too low|0","What do supporters emphasise?|A rigid national rule|Careful planning and flexibility|Longer hours|1","T:Employees' salaries were reduced in the trials.|0","T:Some people worry about longer hours on working days.|1"]],
["Ocean Plastic","Every year, millions of tonnes of plastic enter the oceans, causing harm to marine life and, increasingly, to human health. Sea turtles mistake plastic bags for jellyfish, and seabirds feed their chicks fragments that can never be digested. Even more worrying are microplastics, tiny particles that have been found in drinking water, salt and seafood. Although many countries have banned single-use bags, scientists warn that this alone will not solve the problem, because most ocean plastic comes from fishing equipment and from rivers in regions without proper waste management. Some organisations have developed floating barriers to collect rubbish from rivers before it reaches the sea. Experts agree, however, that the most effective strategy is to produce less plastic in the first place and to design products that can be reused.",["Why do sea turtles eat plastic bags?|They mistake them for jellyfish|They like the taste|They are hungry for salt|0","What are microplastics?|Large fishing nets|Tiny plastic particles|Types of fish|1","Where does most ocean plastic come from, according to scientists?|Beach tourists|Fishing equipment and rivers|Cruise ships|1","What do experts consider most effective?|Producing less plastic|Floating barriers only|Banning fishing|0","T:Banning single-use bags is enough to solve the problem.|0","T:Microplastics have been found in drinking water.|1"]],
["The Rise of Remote Work","Before 2020, remote work was a privilege offered by relatively few employers. When offices closed suddenly, millions of people discovered that many tasks could be done efficiently from home. Employees appreciated saving hours of commuting, while companies noticed that they could reduce the cost of renting large offices. Nevertheless, problems soon appeared. Some workers felt isolated, struggled to separate work from personal life or missed the spontaneous conversations that often lead to new ideas. As a result, many organisations now prefer a hybrid model, in which staff spend two or three days in the office and the remaining days at home. Managers say this approach preserves teamwork without forcing everyone back to a five-day routine. Whether it will remain popular, however, depends on how well firms measure performance rather than simply counting hours at a desk.",["What did employees appreciate about remote work?|Saving commuting time|Higher salaries|Longer breaks|0","What benefit did companies notice?|Lower office costs|More meetings|Fewer employees|0","What is a hybrid model?|Working only at home|Some days in the office, some at home|Working at night|1","What will determine the future of hybrid work?|How performance is measured|The weather|Fashion|0","T:Remote work was common before 2020.|0","T:Some workers felt isolated.|1"]],
["Why We Dream","Scientists have studied sleep for decades, yet they still disagree about why humans dream. One theory suggests that dreams help the brain to organise memories, deciding which experiences should be stored and which can be forgotten. Another proposes that dreaming works like a rehearsal for real-life threats, which would explain why so many dreams involve being chased or failing an exam. A third view is that dreams are simply a by-product of random brain activity, to which the mind then attaches a story. Evidence from experiments is mixed: volunteers who slept after learning a new skill often performed better the next day, which supports the memory theory, but it does not prove that dreams themselves are responsible. For now, researchers agree only that getting enough sleep matters more than understanding every dream.",["What does the first theory say about dreams?|They help organise memories|They predict the future|They have no meaning|0","How does the second theory explain dreams of being chased?|Dreams rehearse real threats|The brain is bored|People eat late|0","What does the experimental evidence show?|It is mixed|It proves the memory theory|It rejects all theories|0","What do researchers agree on?|Enough sleep matters most|Dreams predict exams|Everyone dreams in colour|0","T:Scientists fully understand why we dream.|0","T:One theory says dreams are a by-product of random brain activity.|1"]]],[
["The Paradox of Choice","In affluent societies, consumers are offered an unprecedented range of options, from hundreds of breakfast cereals to dozens of mobile tariffs. Conventional economic wisdom holds that more choice invariably increases satisfaction, since it enables individuals to select precisely what suits them. Psychologists, however, have documented a counterintuitive effect: when confronted with an excessive number of alternatives, people frequently experience anxiety, postpone decisions or abandon them altogether. Even after choosing, they tend to be less content, haunted by the suspicion that a superior option was overlooked. In one widely cited study, shoppers who sampled twenty-four varieties of jam were considerably less likely to buy any than those offered only six. The implications extend well beyond supermarkets. Employers who present staff with bewildering pension plans find that many employees enrol in none, thereby jeopardising their own future. Designers consequently advocate curated selections and sensible defaults, arguing that limiting options, far from restricting freedom, can liberate people to decide with confidence.",["What does conventional economics assume?|More choice always raises satisfaction|Choice reduces income|People dislike options|0","What effect have psychologists documented?|Too many options can cause anxiety and delay|Choice improves memory|Prices fall|0","What happened in the jam study?|Fewer shoppers bought when offered more varieties|More shoppers bought|Prices doubled|0","Why do some employees join no pension plan?|The plans are bewildering|They earn too much|They dislike saving|0","T:The text claims that limiting options can empower decision-making.|1","T:Shoppers offered twenty-four jams bought more often.|0"]],
["Rewilding Britain","Rewilding, the practice of restoring ecosystems to a more natural state, has moved from the fringes of conservation to the heart of public debate. Advocates point to the reintroduction of beavers in parts of Britain, where their dams have slowed floodwaters, created wetlands and benefited countless species of insects, birds and fish. Proposals to release lynx are far more contentious. Farmers fear for their livestock, and some scientists question whether Britain's fragmented landscape could sustain such a predator. Supporters counter that lynx primarily hunt deer, whose unchecked numbers are damaging young woodland, and they note that compensation schemes in other European countries have eased tensions. Ultimately, the debate reveals a deeper question: whether nature should be managed for human benefit or allowed, wherever feasible, to regulate itself. Compromise may lie in involving local communities from the outset, rather than imposing decisions from afar.",["What have beaver dams achieved?|Slowed floodwaters and created wetlands|Reduced woodland|Attracted lynx|0","Why are the lynx proposals contentious?|Farmers fear for their livestock|Lynx eat insects|Beavers dislike them|0","What do supporters say lynx mainly hunt?|Deer|Sheep|Fish|0","What does the author suggest as a compromise?|Involving local communities early|Banning farming|Ignoring scientists|0","T:All scientists agree the landscape can sustain lynx.|0","T:Compensation schemes have been used elsewhere in Europe.|1"]],
["Memory and Technology","Smartphones have become an extension of our memory: we no longer memorise telephone numbers, directions or even birthdays. Some commentators lament this development as cognitive laziness, yet the evidence is more nuanced. Research on the so-called 'Google effect' suggests that people remember where information can be found rather than the information itself, essentially treating the internet as an external hard drive. This arrangement is efficient, provided the technology remains accessible and reliable. The danger lies in confusing retrieval with understanding. Individuals who rely on quick searches may possess isolated facts without grasping the connections that make knowledge meaningful. Educators therefore emphasise that learning to evaluate sources and to build mental frameworks matters more than ever. Far from rendering memory obsolete, technology has merely shifted what is worth remembering, from raw data towards judgement, context and the capacity to ask the right questions.",["What does the 'Google effect' suggest?|People remember where to find information|People remember more facts|Phones improve memory|0","What danger does the author identify?|Confusing retrieval with understanding|Phones breaking|Too many calls|0","What do educators emphasise?|Evaluating sources and building frameworks|Memorising numbers|Banning phones|0","What has technology changed, according to the text?|What is worth remembering|The need for sleep|The speed of learning|0","T:The author believes memory has become obsolete.|0","T:The evidence about phones and memory is described as nuanced.|1"]],
["Urban Cycling","Cities that invest in cycling infrastructure frequently encounter fierce resistance at first. Shopkeepers worry that removing parking spaces will drive away customers, and drivers resent losing road space. Yet data from cities such as Copenhagen and Utrecht tell a different story. Cyclists tend to shop locally and more often, so that spending on high streets has risen, while reduced congestion has shortened journey times for those who must still drive. Health benefits are equally striking: regular cycling cuts the risk of heart disease and lessens pressure on public health services. Nonetheless, success depends on safety. Painted lanes that disappear at junctions persuade few people to cycle, whereas physically separated tracks attract cautious riders, including children and the elderly. Planners therefore regard protected networks not as a luxury but as the prerequisite for any serious attempt to change how people move through a city.",["Why do shopkeepers often oppose cycle lanes?|They fear losing customers who park|They dislike bicycles|They want wider pavements|0","What has happened to high-street spending in cycling cities?|It has risen|It has collapsed|It stayed hidden|0","Why do painted lanes attract few people?|They disappear at junctions|They are too wide|They are expensive|0","What do planners consider essential?|Protected networks|More parking|Higher fares|0","T:Reduced congestion has shortened journeys for drivers.|1","T:Physically separated tracks mainly attract experienced racers.|0"]]]];

["The Benefits of Volunteering","Volunteering means working without payment to help other people or the environment. Many teenagers now volunteer at animal shelters, hospitals or community kitchens. Apart from helping others, volunteers gain useful skills such as teamwork and communication, which employers value highly. Some young people also discover what career they would like to follow. Of course, volunteering takes time, so it is important not to take on more than you can manage. Experts suggest starting with just a few hours a month and increasing gradually if you enjoy it.",["What is volunteering?|Working without payment to help|A paid summer job|A school subject|0","What skills do volunteers gain?|Teamwork and communication|Cooking only|Driving|0","What do experts advise beginners to do?|Start with a few hours a month|Work every day|Avoid new tasks|0","T:Volunteering can help people choose a career.|1","T:Volunteering never takes much time.|0"]],
["The Invention of the Bicycle","The first bicycle, built in 1817 by a German baron, had no pedals. Riders pushed themselves along with their feet, and the machine was called a running machine. Pedals were added to the front wheel about forty years later, making bicycles faster but also uncomfortable on rough roads. In the 1880s the safety bicycle appeared, with two wheels of equal size and a chain. It was much safer and soon became popular, especially among women, who gained a new sense of independence.",["What was special about the first bicycle?|It had no pedals|It had three wheels|It had an engine|0","What was the problem with early pedal bicycles?|They were uncomfortable|They were slow|They were cheap|0","What was the safety bicycle?|A bike with equal wheels and a chain|A bike for children|A race bike|0","T:The safety bicycle appeared in the 1880s.|1","T:The first bicycle was built in France.|0"]],
["Fast Fashion","Fast fashion refers to cheap clothes that follow the latest trends and are produced very quickly. Customers love low prices, but there is a hidden cost. Factories use huge amounts of water, and many clothes are thrown away after only a few wears. Cheap garments also tend to fall apart quickly, so people buy more. Some shoppers now choose second-hand clothes or repair what they already own. Others buy fewer items of better quality, which may cost more at first but last much longer.",["What is fast fashion?|Cheap trendy clothes made quickly|Expensive designer clothes|School uniforms|0","What is one problem of fast fashion?|Huge water use|Too few shops|Clothes are too strong|0","What do some shoppers do instead?|Buy second-hand or repair clothes|Stop wearing clothes|Buy more|0","T:Cheap clothes usually last a long time.|0","T:Better-quality items can last longer.|1"]],

["The Mystery of Sleep Talking","Sleep talking is a common habit, especially among children. People who talk in their sleep usually do not remember it the next morning. Most of the time the words are short and make little sense, though some people speak whole sentences. Scientists say it is harmless and often connected with stress, lack of sleep or fever. It can disturb the people who sleep nearby, however. To reduce it, doctors recommend going to bed at the same time every night and avoiding coffee in the evening.",["Who sleep-talks most often?|Children|Doctors|Old people only|0","What is sleep talking connected with?|Stress, lack of sleep or fever|Hunger|Cold weather|0","What do doctors recommend?|A regular bedtime and no evening coffee|Sleeping less|Taking medicine|0","T:People usually remember sleep talking.|0","T:Sleep talking is harmless according to scientists.|1"]]],[
["The Gig Economy","The gig economy, in which people earn money through short-term jobs arranged via apps, has grown rapidly over the past decade. Drivers, delivery couriers and freelance designers all belong to this new workforce. For many, the main attraction is flexibility: they can choose when and where to work. Yet critics point out that gig workers usually lack paid holidays, sick pay and a stable income, so one illness can create serious financial problems. Several governments are considering new laws to give such workers basic protection without destroying the flexibility that makes the system attractive. Whether a balance can be found remains an open question.",["What attracts people to gig work?|Flexibility|Guaranteed pensions|Long contracts|0","What do gig workers usually lack?|Sick pay and a stable income|Phones|Customers|0","What are some governments considering?|Laws to protect workers|Banning apps|Raising prices|0","T:Gig work is arranged through apps.|1","T:All gig workers receive paid holidays.|0"]],
["The Science of Habits","Researchers estimate that around forty percent of our daily actions are habits rather than conscious decisions. A habit usually consists of three parts: a cue, a routine and a reward. For example, feeling stressed (the cue) may lead to snacking (the routine), which gives a moment of comfort (the reward). Because the brain links the cue to the reward automatically, simply deciding to stop is rarely enough. Psychologists therefore advise keeping the same cue and reward but replacing the routine, such as taking a short walk instead of eating. Small changes repeated consistently tend to last longer than dramatic ones.",["What are the three parts of a habit?|Cue, routine and reward|Thought, action and result|Plan, effort and prize|0","What do psychologists advise?|Replace the routine|Remove all cues|Avoid rewards|0","What lasts longer, according to the text?|Small consistent changes|Dramatic changes|Rewards|0","T:About forty percent of actions are habits.|1","T:Deciding to stop is usually enough.|0"]],

["The Art of Negotiation","Negotiation is often imagined as a contest in which one side wins and the other loses. Experienced negotiators, however, treat it as a joint search for a solution that satisfies both parties. They begin by understanding what the other side really needs, which is not always the same as what they demand. For instance, an employee asking for a higher salary may mainly want recognition, which could be offered in other ways. Good negotiators also prepare alternatives in advance, so they are not forced to accept a poor deal. Above all, they remain calm and listen more than they speak.",["How do experienced negotiators see negotiation?|As a joint search for a solution|As a fight|As a game of luck|0","What do they try to understand first?|The other side's real needs|Their rivals' salaries|The law|0","Why do they prepare alternatives?|To avoid accepting a poor deal|To confuse the others|To save time|0","T:Good negotiators speak more than they listen.|0","T:An employee may want recognition rather than money.|1"]],
["Street Food Culture","Street food has long been a vital part of urban life, offering cheap, tasty meals to workers in a hurry. In cities such as Bangkok, Istanbul and Tashkent, stalls selling samsa, kebabs or noodles attract customers from every background. Tourists often regard street food as an authentic way to experience local culture. Health authorities, however, stress the importance of hygiene, since badly stored food can cause illness. Some cities have introduced licences and regular inspections, while others have created special food markets where stalls are organised and monitored. These measures help to preserve traditional cooking and protect customers at the same time.",["Why is street food popular with workers?|It is cheap and quick|It is only healthy|It is free|0","What concerns do health authorities have?|Hygiene|Taste|Prices|0","What have some cities introduced?|Licences and inspections|Taxes on tourists|New recipes|0","T:Tourists often see street food as authentic.|1","T:Street food exists only in Bangkok.|0"]],
["The Psychology of Colour","Colours can influence our mood and behaviour more than we realise. Blue is frequently associated with calm and trust, which is why many banks and technology companies use it in their logos. Red, on the other hand, can increase heart rate and create a sense of urgency, so it is common in sales advertisements. Green often suggests nature and health. However, the meaning of colours varies between cultures: white symbolises purity in some countries but mourning in others. Designers therefore need to research their audience carefully before choosing a colour scheme for a product or a website.",["Why do many banks use blue?|It suggests calm and trust|It is cheap|It is bright|0","What effect can red have?|It can create urgency|It makes people sleepy|It reduces hunger|0","Why must designers research their audience?|Colour meanings differ between cultures|Colours are expensive|People dislike green|0","T:White has the same meaning everywhere.|0","T:Green often suggests nature and health.|1"]]],[
["The Ethics of Artificial Intelligence","As artificial intelligence systems become capable of writing, diagnosing and even composing music, ethical questions have moved from academic journals to boardrooms. A central concern is bias: algorithms trained on historical data may reproduce existing prejudices, for instance by favouring certain candidates in recruitment. Another is accountability. When an automated system makes a harmful decision, it is unclear whether responsibility lies with the developers, the company deploying it or the user. Some experts advocate mandatory audits and transparent documentation, comparable to safety tests in the pharmaceutical industry. Sceptics respond that excessive regulation might stifle innovation and hand an advantage to less scrupulous competitors abroad. The challenge, therefore, is to design oversight that is proportionate and adaptable.",["What is meant by bias in AI?|Systems reproducing prejudices from past data|Systems being too slow|Systems costing too much|0","What is the accountability problem?|It is unclear who is responsible for harm|Nobody uses AI|Developers are paid too little|0","What do sceptics fear about heavy regulation?|It might stifle innovation|It would cause bias|It is too cheap|0","T:Some experts compare audits to pharmaceutical safety tests.|1","T:The author argues that regulation should be rigid.|0"]],
["The Decline of Bees","Pollinating insects, above all bees, are responsible for a considerable proportion of the crops that feed humanity. Yet populations have been declining in many regions, a phenomenon attributed to a combination of pesticide use, habitat loss and disease. The consequences extend beyond agriculture: wild plants also depend on pollinators, and their disappearance would disrupt entire ecosystems. Some farmers have responded by planting flower margins around their fields, which provide food and shelter without significantly reducing the cultivated area. Urban beekeeping has also flourished, although ecologists caution that an excess of hives in cities can compete with wild bees for scarce flowers. Lasting recovery, they argue, will require coordinated changes in farming practice rather than isolated gestures.",["What are the main causes of the decline?|Pesticides, habitat loss and disease|Cold winters|Overpopulation of bees|0","What have some farmers done?|Planted flower margins|Banned crops|Removed hives|0","What risk do ecologists see in urban beekeeping?|Competition with wild bees|Noise|Pollution|0","T:Wild plants also depend on pollinators.|1","T:Ecologists say isolated gestures will fix the problem.|0"]],
["Language and Thought","Does the language we speak shape the way we think? The idea, known as linguistic relativity, has fascinated scholars for generations. Early versions claimed that speakers of different languages inhabit different mental worlds, a view now considered exaggerated. More recent research is subtler. Studies suggest that languages which use compass directions rather than left and right train their speakers to maintain a remarkable sense of orientation. Similarly, speakers of languages with many words for blue distinguish shades of that colour more quickly. These effects are modest and do not prevent anyone from understanding concepts that their language lacks. Language, it seems, nudges attention rather than imprisoning thought.",["What is linguistic relativity?|The idea that language shapes thought|A grammar rule|A translation method|0","How do compass-direction languages affect speakers?|They develop a strong sense of orientation|They forget directions|They cannot use maps|0","How does the author describe the effects?|Modest|Enormous|Non-existent|0","T:Early versions of the theory are seen as exaggerated.|1","T:Language completely imprisons thought.|0"]],
["The Economics of Happiness","Economists have long assumed that higher income inevitably leads to greater wellbeing, yet surveys complicate this picture. Within a country, wealthier individuals generally report higher satisfaction. Across time, however, rising national income does not always produce a corresponding rise in happiness, a puzzle known as the Easterlin paradox. One explanation is that people judge their circumstances by comparison with others, so when everyone becomes richer, relative position remains unchanged. Another is adaptation: new luxuries quickly become routine. Policymakers have consequently begun to complement conventional indicators such as GDP with measures of health, social connection and sense of purpose, arguing that prosperity should be judged by how people actually live.",["What does the Easterlin paradox describe?|Rising income without rising happiness|Falling prices|Higher taxes|0","Why does comparison matter?|People judge themselves against others|Money disappears|Prices rise|0","What have policymakers started to do?|Add wellbeing measures to GDP|Abolish GDP|Reduce wages|0","T:Wealthier individuals generally report higher satisfaction within a country.|1","T:Luxuries stay exciting forever.|0"]],
["Space Debris","Since the launch of Sputnik in 1957, thousands of satellites have been placed in orbit, and many have been abandoned when they stopped working. Together with fragments from collisions and rocket stages, they form a growing cloud of debris travelling at speeds exceeding twenty thousand kilometres per hour. At such velocities, even a paint fleck can damage a spacecraft. Experts warn of a chain reaction, known as the Kessler syndrome, in which each collision creates more fragments, ultimately making certain orbits unusable. Proposed remedies include satellites that capture debris with nets and rules requiring operators to remove their equipment within a few years. Yet without binding international agreements, progress is likely to remain slow.",["How fast does debris travel?|More than 20,000 km/h|About 100 km/h|Slower than planes|0","What is the Kessler syndrome?|A chain reaction of collisions|A type of satellite|A rocket fuel|0","What remedy is proposed?|Nets that capture debris|Bigger satellites|Fewer launches only|0","T:A tiny paint fleck can damage a spacecraft.|1","T:The author expects fast progress.|0"]],
["The Value of Boredom","In an age of constant notifications, boredom has become something to be eliminated at the first opportunity. Psychologists, however, suggest that this reflex may be costly. When the mind is under-stimulated, it begins to wander, and such wandering is closely associated with creative problem-solving and long-term planning. In one experiment, participants who first performed a dull task produced more original ideas afterwards than those who had not. Boredom also signals that current activities lack meaning, prompting people to seek more rewarding ones. None of this implies that endless tedium is beneficial; rather, occasional unstructured time may serve as a necessary pause in which fresh ideas can emerge.",["What happens when the mind is under-stimulated?|It wanders|It sleeps|It forgets|0","What did the experiment find?|Dull tasks led to more original ideas|Dull tasks reduced creativity|Nothing changed|0","What does boredom signal?|Current activities lack meaning|The person is ill|The task is easy|0","T:The author claims that endless boredom is beneficial.|0","T:Mind wandering is linked to creative problem-solving.|1"]]]];
